<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240" viewBox="0 0 420 240" role="img" aria-label="SYSTEM STATUS">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b1d2b" stroke-width="1" opacity=".55"/>
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <clipPath id="shape"><path d="M0 0H406L420 14V240H14L0 226Z"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    .label { fill: #7d8aa3; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; }
    .value { fill: #e6f6ff; font-size: 22px; font-weight: 700; }
    .title { fill: #00f0ff; font-size: 12px; letter-spacing: 3px; font-weight: 700; }
    .code { fill: #ff2bd6; font-size: 11px; letter-spacing: 2px; }
    .grow { animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; transform-box: fill-box; transform-origin: left; }
    @keyframes grow { from { transform: scaleX(0); } }
    .blink { animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#shape)">
    <rect width="420" height="240" fill="#050508"/>
    <rect width="420" height="240" fill="url(#grid)"/>
  </g>
  <path d="M0.5 0.5H406L419.5 14V239.5H14L0.5 226Z" fill="none" stroke="url(#edge)" stroke-opacity=".7"/>
